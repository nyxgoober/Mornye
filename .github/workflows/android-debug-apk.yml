name: Android APK

# Manual build. Needs no secrets: Discord SDK is skipped (Lite build) and
# Gradle signs with its fallback debug key when there is no key.properties.
#
# "Apply patches or overwrite zip": when true, the workflow first looks in the
# repository root for
#   - *.patch        applied in name order with `git apply`
#   - overwrite.zip  extracted over the tree, replacing existing files
# (patches first, then the zip). The applied files are then deleted, the
# result is committed and pushed to the branch you ran the workflow on, and
# the APK is built from that new state.

on:
  workflow_dispatch:
    inputs:
      apply_changes:
        description: "Apply patches or overwrite zip (*.patch / overwrite.zip in repo root), then commit and push"
        type: boolean
        default: false
      build_type:
        description: "Build type"
        type: choice
        options:
          - release
          - debug
        default: release

permissions:
  contents: write

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      MORNYE_DISCORD_SDK: "0"
      # Add armeabi-v7a (comma-separated) if you need 32-bit devices.
      MORNYE_RUST_ANDROID_ABIS: "arm64-v8a"

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Apply patches or overwrite zip
        if: ${{ inputs.apply_changes }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          patches=(./*.patch)
          zip=""
          [[ -f overwrite.zip ]] && zip="overwrite.zip"
          if [[ ${#patches[@]} -eq 0 && -z "$zip" ]]; then
            echo "::error::No *.patch or overwrite.zip found in the repository root."
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          for p in "${patches[@]}"; do
            echo "Applying $p"
            git apply --index --whitespace=nowarn "$p"
            git rm -q -f -- "$p"
          done

          if [[ -n "$zip" ]]; then
            echo "Extracting $zip over the tree"
            unzip -q -o "$zip" -x '.git/*' '__MACOSX/*' 'overwrite.zip'
            git rm -q -f -- "$zip"
          fi

          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -q -m "Apply remote changes (${#patches[@]} patch(es)${zip:+, overwrite.zip})"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
          git log --oneline -3

      - name: Setup Java
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: "temurin"
          java-version: "25"

      - name: Setup Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: "stable"
          flutter-version-file: .fvmrc
          cache: true

      - name: Prepare Flutter framework patch
        run: dart scripts/prepare_flutter_sdk.dart

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          gradle-version: "9.8.2"

      - name: Install Android SDK & NDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "ndk;30.0.16248370" \
            "platforms;android-37.0" \
            "build-tools;37.0.0" \
            "cmake;4.1.2"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/30.0.16248370" >> "$GITHUB_ENV"

      - name: Get Flutter dependencies
        run: flutter pub get

      - name: Configure Flutter SDK for Gradle
        run: echo "flutter.sdk=$FLUTTER_ROOT" > android/local.properties

      - name: Install Rust build prerequisites
        run: |
          cd rust_backend
          rustup show
          sudo apt-get update
          sudo apt-get install -y libclang-dev

      - name: Cache Cargo registry and build output
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            rust_backend/target
          key: cargo-${{ runner.os }}-debug-apk-${{ hashFiles('rust_backend/rust-toolchain.toml') }}-${{ hashFiles('rust_backend/Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-debug-apk-${{ hashFiles('rust_backend/rust-toolchain.toml') }}-

      - name: Build APK
        run: flutter build apk --${{ inputs.build_type }} --target-platform android-arm64

      - name: List APKs
        run: ls -lh build/app/outputs/flutter-apk/*.apk

      - name: Upload APK
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mornye-${{ inputs.build_type }}-apk-${{ github.run_number }}
          if-no-files-found: error
          retention-days: 30
          path: build/app/outputs/flutter-apk/*.apk
